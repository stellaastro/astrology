# Production environment for the live API.
#
# ROOT CAUSE THIS FIXES: the unit loads
#   EnvironmentFile=/home/stellaastro/htdocs/www.stellaastro.com/.env
# which is the DEVELOPMENT file — APP_ENV=development, NODE_ENV=development, and
# a DATABASE_URL pointing at stellaastro_dev, a database holding 25 synthetic
# fixture rows. systemd lets EnvironmentFile override Environment=, so the
# unit's own `Environment=NODE_ENV=production` was being silently replaced by
# `development` from that file. The live public API was therefore writing real
# signups into the dev database, and the ADR-026 fixture guard — which reads
# APP_ENV — saw "development" and allowed it.
#
# An empty EnvironmentFile= resets the inherited list; the production file then
# supplies all 21 variables. Resetting is required: without it the dev file is
# still read and still wins.
[Service]
EnvironmentFile=
EnvironmentFile=/home/stellaastro/secrets/api.production.env
# Belt and braces: NestJS ConfigModule also reads an env file of its own, and
# ENV_FILE points it at the same one. See services/api/src/app.module.ts.
Environment=ENV_FILE=/home/stellaastro/secrets/api.production.env
