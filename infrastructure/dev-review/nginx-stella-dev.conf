# Stella review server — https://www.stellaastro.com:8434
#
# Proxies to `next dev` on :3001 so the owner can watch changes land with hot
# reload. Production is untouched on :3000 behind the normal vhost.
#
# Behind basic auth deliberately: the dev server serves unminified source and
# renders stack traces into the page on an exception. That is fine for a
# named reviewer and wrong for anyone who finds the port.
#
# Port 8434 sits inside the 8433:8443 range ufw already allows, so no firewall
# change was needed. Separate file from the CloudPanel-managed vhost so a panel
# rewrite cannot clobber it.

server {
  listen 8434 ssl;
  listen [::]:8434 ssl;
  http2 on;

  server_name www.stellaastro.com stellaastro.com;

  ssl_certificate_key /etc/nginx/ssl-certificates/www.stellaastro.com.key;
  ssl_certificate     /etc/nginx/ssl-certificates/www.stellaastro.com.crt;

  # Never let a search engine index a dev build, even if auth were removed.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  auth_basic "Stella review server";
  auth_basic_user_file /etc/nginx/stella-dev.htpasswd;

  # Dev builds are large and compile on demand; the first hit on a route can
  # take several seconds.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  client_max_body_size 32m;

  # The API. Without this, /api/v1 on the review server hits Next.js and 404s,
  # so any form is untestable here — which defeats the point of a review server.
  #
  # NOTE: this proxies to the one API instance, which is PRODUCTION. Submissions
  # made on the review server therefore write to the production database. A
  # second API running in development mode on its own port is the correct
  # follow-up; until then, clean up anything you submit here.
  location /api/v1 {
    # No basic auth on the API. A browser's fetch() sends no credentials, so
    # requiring auth here makes every form on the review server fail with 401 —
    # which looks like a broken form rather than a blocked request. It costs
    # nothing in exposure: this is the same API already served publicly on 443.
    auth_basic off;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Fast Refresh pushes updates over a WebSocket. Without these two headers
    # the page loads but never updates, which looks exactly like "hot reload
    # is broken" rather than "the proxy dropped the upgrade".
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_buffering off;
  }
}
